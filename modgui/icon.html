<div class="mod-pedal ce-pedal">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>
    <div class="ce-knob ce-rate" mod-role="input-control-port" mod-port-symbol="rate" mod-widget="film"></div>
    <div class="ce-knob ce-depth" mod-role="input-control-port" mod-port-symbol="depth" mod-widget="film"></div>
    <div class="ce-mix" mod-role="input-control-port" mod-port-symbol="mix" mod-widget="film"></div>
    <div class="ce-switch" mod-role="input-control-port" mod-port-symbol="model" mod-widget="film"></div>
    <div class="ce-led mod-light" mod-role="bypass-light"></div>
    <div class="ce-foot mod-footswitch" mod-role="bypass"></div>
    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}" mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}" mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>
</div>
